version: 0.2

env:
  shell: bash

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - npm install --global "@openai/codex@${CODEX_CLI_VERSION:-0.137.0}"
      - codex --version
  pre_build:
    commands:
      - cd agent && npm ci && cd ..
      - |
        aws secretsmanager get-secret-value \
          --secret-id "$CODEX_SECRET_ARN" \
          --query SecretString \
          --output text |
        node -e '
          let source = "";
          process.stdin.setEncoding("utf8");
          process.stdin.on("data", (chunk) => { source += chunk; });
          process.stdin.on("end", () => {
            const key = JSON.parse(source).CODEX_API_KEY;
            if (!key || typeof key !== "string") throw new Error("CODEX_API_KEY is missing");
            process.stdout.write(key);
          });
        ' > /tmp/codex-api-key
      - chmod 600 /tmp/codex-api-key
  build:
    commands:
      - |
        OPTIMIZER_CODEX_KEY_FILE=/tmp/codex-api-key \
        bash deploy/aws/optimizer/run-loop.sh
  post_build:
    commands:
      - rm -f /tmp/codex-api-key

artifacts:
  files:
    - optimizer-artifacts/**/*
