version: 0.2

env:
  shell: bash

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - npm install --global "@openai/codex@${CODEX_CLI_VERSION:-0.137.0}"
      - codex --version
  pre_build:
    commands:
      - cd agent && npm ci && cd ..
  build:
    commands:
      - |
        OPTIMIZER_CODEX_SECRET_ARN="$CODEX_SECRET_ARN" \
        bash deploy/aws/optimizer/run-loop.sh

artifacts:
  files:
    - optimizer-artifacts/**/*
